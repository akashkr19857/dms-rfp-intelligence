# Written and syntax-checked, NOT run: Docker is not installed on the development laptop.
services:
  ollama:
    image: ollama/ollama:0.12.3
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      RFP_OLLAMA_URL: http://ollama:11434
      RFP_CORS_ORIGINS: http://localhost:3200
    volumes: [rfp-data:/app/data/runtime]
    ports: ["8200:8200"]
    depends_on: [ollama]
  web:
    build:
      context: ./frontend
      args: {NEXT_PUBLIC_API_URL: "http://localhost:8200"}
    ports: ["3200:3200"]
    depends_on: [api]
volumes:
  ollama: {}
  rfp-data: {}
